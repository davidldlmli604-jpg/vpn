# Сборка установщика для Windows на настоящей Windows (на Linux установщик .exe не собирается: нужен wine).
# Запуск: вкладка Actions → «Сборка для Windows» → Run workflow.
# Каждый запуск выпускает новую версию 0.2.<номер запуска>: выкладывает её в раздел Releases (оттуда её
# сама скачивает уже установленная программа — автообновление) и в Artifacts этого запуска.
name: Сборка для Windows

on:
  workflow_dispatch:

permissions:
  contents: write # создать выпуск (Release) и метку версии

jobs:
  tests:
    name: Проверки (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:singbox
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Установщик (Windows) и выпуск
    needs: tests
    runs-on: windows-latest
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # номер версии растёт с каждым запуском: по нему установленная программа понимает, что вышло обновление
      - run: npm version ${{ env.VERSION }} --no-git-tag-version
      # метка версии ставится на тот коммит, из которого собрано (метки от этой сборки других сборок не запускают)
      - name: Метка версии
        shell: bash
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
      # Выпуск создаём заранее черновиком: если его создаёт сборщик, при одновременной загрузке нескольких файлов
      # получаются два выпуска с одной меткой (так вышло с 0.2.4) — и ссылка на установщик даёт 404.
      - name: Черновик выпуска
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$VERSION" --draft --verify-tag --title "$VERSION" --notes "Тропа $VERSION для Windows. Установленная программа обновится сама; вручную — скачайте tropa-setup-$VERSION.exe."
      # проверка типов → сборка → движок (с проверкой SHA-256) → установщик → файлы в черновик (с latest.yml для обновления)
      - run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Опубликовать выпуск
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v$VERSION" --json assets --jq '.assets[].name' | tee assets.txt
          grep -qx "tropa-setup-$VERSION.exe" assets.txt
          grep -qx "latest.yml" assets.txt
          gh release edit "v$VERSION" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: tropa-windows-${{ env.VERSION }}
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
